<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>💖 Happy Birthday Eijuuu 💖</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff9acb,#ffc2dd,#ffddee);
font-family:Arial,sans-serif;
}

.container{
text-align:center;
z-index:2;
padding:20px;
}

h1{
font-size:42px;
color:white;
text-shadow:0 0 15px hotpink;
animation:zoom 2s infinite alternate;
}

p{
margin-top:20px;
font-size:22px;
color:white;
}

button{
margin-top:35px;
padding:15px 35px;
border:none;
border-radius:50px;
background:#ff2e7e;
color:white;
font-size:20px;
cursor:pointer;
box-shadow:0 0 20px hotpink;
transition:.3s;
}

button:hover{
transform:scale(1.1);
}

@keyframes zoom{
from{transform:scale(1);}
to{transform:scale(1.08);}
}

.heart{
position:absolute;
color:#ff2e7e;
font-size:24px;
animation:float 8s linear infinite;
}

@keyframes float{
0%{
transform:translateY(100vh);
opacity:0;
}
100%{
transform:translateY(-120vh);
opacity:1;
}
}

#message{
display:none;
margin-top:30px;
font-size:28px;
color:white;
line-height:1.8;
animation:fade 2s;
}

@keyframes fade{
from{opacity:0;}
to{opacity:1;}
}
</style>
</head>

<body>

<div class="container">

<h1>🎂 Happy Birthday Eijuuu ❤️</h1>

<p>My Princess Aleeza 💖</p>

<button onclick="showLove()">
🎁 Open Your Surprise
</button>

<div id="message">
💖 Every heartbeat of mine whispers your name.<br><br>

Happy Birthday My Love ❤️<br><br>

You are my happiness, my smile and my everything. 🌹
</div>

</div>

<script>
function showLove(){
document.getElementById("message").style.display="for(let i=0;i<40;i++){

let heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="💖";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(20+Math.random()*30)+"px";

heart.style.animationDuration=(4+Math.random()*5)+"s";

heart.style.animationDelay=Math.random()*5+"s";

document.body.appendChild(heart);

}
</script>

</body>
</html>
